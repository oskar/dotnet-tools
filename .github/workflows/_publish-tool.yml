name: "Publish tool to NuGet"
on:
  workflow_call:
    inputs:
      csproj:
        required: true
        type: string
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    name: publish
    environment: nuget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5.0.0
        with:
          dotnet-version: "8.0.x"
      - run: dotnet pack ${{ inputs.csproj }} -c Release -o .
      - id: login
        uses: NuGet/login@v1
        with:
          user: oskarh
      - run: dotnet nuget push *.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
